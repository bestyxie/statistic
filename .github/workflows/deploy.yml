name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    name: Deploy API (Workers)
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run D1 migrations
        working-directory: packages/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # 迁移记录表：保证每个迁移只执行一次（ALTER 等 SQLite 无法写成幂等的语句也能安全重跑）
          pnpm exec wrangler d1 execute statistic-db --remote \
            --command "CREATE TABLE IF NOT EXISTS schema_migrations (name TEXT PRIMARY KEY, applied_at TEXT DEFAULT (datetime('now')));"
          for f in migrations/*.sql; do
            name=$(basename "$f")
            if pnpm exec wrangler d1 execute statistic-db --remote --json \
                 --command "SELECT name FROM schema_migrations WHERE name='$name';" \
                 | grep -q "\"$name\""; then
              echo "Skipping already-applied migration: $name"
            else
              echo "Running migration: $f"
              pnpm exec wrangler d1 execute statistic-db --remote --file="$f"
              pnpm exec wrangler d1 execute statistic-db --remote \
                --command "INSERT INTO schema_migrations (name) VALUES ('$name');"
            fi
          done

      - name: Deploy to Cloudflare Workers
        working-directory: packages/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy

  deploy-web:
    runs-on: ubuntu-latest
    name: Deploy Web (Pages)
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @statistic/web build
        env:
          VITE_API_BASE: https://statistic-api.gabbyxie714.workers.dev/api

      - name: Deploy to Cloudflare Pages
        working-directory: packages/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler pages deploy ../web/dist --project-name=statistic-web
